<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submission to RITHIK</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        div {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }

        button {
            background-color: #007BFF;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: ease-in;
            transition-duration: 0.5s;
        }

        button:hover {
            text-align: center;
            background-color: #0056b3;
            transition-duration: 0.5s;
            border:4px solid #0056b3 ;

        }
    </style>
</head>

<body>

    <h1>Information Form Submission</h1>

    <form action="https://formsubmit.co/silentdude689@gmail.com" method="POST">

        <!-- Disable captcha -->
        <input type="hidden" name="_captcha" value="false">

        <!-- Optional success page -->
        <!--
        <input type="hidden" name="_next" value="https://yourwebsite.com/thanks.html">
        -->

        <div>
            <label for="username">Enter your username</label>
            <input type="text" id="username" name="username" placeholder="Enter here" required autofocus>
        </div>

        <div>
            <label for="number">Enter your Number here</label>
            <input type="number" id="number" name="number" placeholder="Number Here" required>
        </div>

        <div>
            <label for="em">Enter your Email :</label>
            <input type="email" id="em" name="email" placeholder="E-mail Here" required>
        </div>

        <div>
            <label>Select Your Gender :</label>
            <br><br>

            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </div>

        <div>
            <label for="comt">Enter your Comment...</label>
            <textarea name="comment" rows="5" id="comt" placeholder="Comment Here"></textarea>
        </div>

        <div>
            <input type="checkbox" id="sub" name="subscription" value="Subscribed">
            <label for="sub">Subscribe to Newsletter</label>
        </div>

        <button type="submit">Send to Rithik</button>

    </form>

</body>

</html>
